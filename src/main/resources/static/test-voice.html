<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Voice Pipeline Test — VAD, STT &amp; TTS</title>
    <style>
        *, *::before, *::after {
            box-sizing: border-box;
        }

        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #FFFFFF;
            color: #111827;
            font-family: -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", Roboto, sans-serif;
            -webkit-font-smoothing: antialiased;
        }

        .split-layout {
            display: grid;
            grid-template-columns: 1fr 1px 1fr;
            height: 100vh;
            width: 100%;
            overflow: hidden;
        }

        .divider {
            background: #E5E7EB;
            width: 1px;
            height: 100%;
        }

        .pane {
            display: flex;
            flex-direction: column;
            padding: 28px 36px;
            height: 100vh;
            min-height: 0;
            min-width: 0;
            overflow: hidden;
        }

        @media (max-width: 820px) {
            html, body {
                overflow-y: auto;
                height: auto;
            }
            .split-layout {
                grid-template-columns: 1fr;
                height: auto;
                overflow: visible;
            }
            .divider {
                width: 100%;
                height: 1px;
            }
            .pane {
                height: 50vh;
                padding: 24px 20px;
            }
        }

        /* Top toolbar */
        .toolbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            flex-wrap: wrap;
            padding-bottom: 18px;
        }

        .pane-title {
            font-size: 0.9rem;
            font-weight: 600;
            letter-spacing: 0.02em;
            color: #6B7280;
            text-transform: uppercase;
        }

        .controls {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
        }

        button {
            appearance: none;
            border: 1px solid #E5E7EB;
            background: #111827;
            color: #FFFFFF;
            border-radius: 999px;
            padding: 8px 18px;
            font-size: 0.88rem;
            font-weight: 500;
            font-family: inherit;
            cursor: pointer;
            transition: background 0.15s ease, opacity 0.15s ease, transform 0.1s ease;
        }

        button:hover:not(:disabled) {
            background: #1F2937;
        }

        button:active:not(:disabled) {
            transform: scale(0.98);
        }

        button.ghost {
            background: #FFFFFF;
            color: #374151;
            border-color: #E5E7EB;
        }

        button.ghost:hover:not(:disabled) {
            background: #F9FAFB;
        }

        button.recording {
            background: #111827;
            border-color: #22C55E;
            box-shadow: 0 0 12px rgba(34, 197, 94, 0.22);
        }

        button:disabled {
            opacity: 0.45;
            cursor: not-allowed;
        }

        select {
            appearance: none;
            border: none;
            background: #F3F4F6;
            color: #111827;
            border-radius: 999px;
            padding: 8px 16px;
            font-size: 0.88rem;
            font-weight: 500;
            font-family: inherit;
            cursor: pointer;
            outline: none;
        }

        select:hover {
            background: #E5E7EB;
        }

        .status-pill {
            font-size: 0.8rem;
            font-weight: 500;
            color: #6B7280;
            padding: 4px 11px;
            border-radius: 999px;
            background: #F3F4F6;
            transition: all 0.2s ease;
        }

        .status-pill.speaking {
            color: #166534;
            background: #DCFCE7;
        }

        .status-pill.listening {
            color: #111827;
            background: #F3F4F6;
        }

        /* Center area */
        .pane-body {
            flex: 1;
            display: flex;
            flex-direction: column;
            min-height: 0;
        }

        /* Waveform center */
        .wave-stage {
            flex: 0 0 190px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 8px 0 16px;
        }

        canvas#waveCanvas {
            width: 100%;
            max-width: 480px;
            height: 130px;
            display: block;
        }

        /* Transcript bubbles */
        .bubbles-wrap {
            flex: 1;
            min-height: 0;
            overflow-y: auto;
            scrollbar-width: none;
            display: flex;
            flex-direction: column;
            gap: 10px;
            padding: 6px 2px 12px;
        }

        .bubbles-wrap::-webkit-scrollbar {
            display: none;
        }

        .bubble {
            align-self: flex-start;
            max-width: 88%;
            background: #F5F6F7;
            color: #111827;
            border-radius: 18px;
            padding: 12px 18px;
            font-size: 1rem;
            line-height: 1.55;
            animation: fadeUp 0.18s ease-out;
        }

        .bubble-text {
            unicode-bidi: plaintext;
        }

        .bubble-meta {
            margin-top: 4px;
            font-size: 0.74rem;
            color: #9CA3AF;
            direction: ltr;
            text-align: left;
        }

        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(4px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Seamless TTS input */
        .tts-stage {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            padding: 12px 0;
        }

        textarea#ttsText {
            width: 100%;
            min-height: 220px;
            border: none;
            outline: none;
            background: transparent;
            color: #111827;
            font-family: inherit;
            font-size: 1.25rem;
            line-height: 1.7;
            resize: none;
            padding: 8px 0;
            unicode-bidi: plaintext;
        }

        textarea#ttsText::placeholder {
            color: #D1D5DB;
        }

        .tts-footer {
            padding-top: 12px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .sub-meta {
            font-size: 0.8rem;
            color: #9CA3AF;
            min-height: 18px;
        }

        audio#ttsAudio {
            width: 100%;
            height: 40px;
            display: none;
        }

        audio#ttsAudio.visible {
            display: block;
        }
    </style>
</head>
<body>
<main class="split-layout">

    <!-- Left Pane: TTS -->
    <section class="pane">
        <div class="toolbar">
            <span class="pane-title">Text to Speech</span>
            <div class="controls">
                <select id="ttsEmotion" aria-label="Tone">
                    <option value="warm">Warm</option>
                    <option value="empathetic">Empathetic</option>
                    <option value="happy">Happy</option>
                    <option value="calm">Calm</option>
                    <option value="curious">Curious</option>
                </select>
                <button id="ttsBtn">Generate</button>
            </div>
        </div>

        <div class="pane-body">
            <div class="tts-stage">
                <textarea id="ttsText" dir="auto" placeholder="Type text to synthesize..."></textarea>
            </div>
            <div class="tts-footer">
                <div class="sub-meta" id="ttsStatus"></div>
                <audio id="ttsAudio" controls></audio>
            </div>
        </div>
    </section>

    <div class="divider" aria-hidden="true"></div>

    <!-- Right Pane: VAD + STT -->
    <section class="pane">
        <div class="toolbar">
            <span class="pane-title">Speech &amp; VAD</span>
            <div class="controls">
                <span id="vadBadge" class="status-pill">Idle</span>
                <button id="resetBtn" class="ghost">Reset</button>
                <button id="micBtn">Start</button>
            </div>
        </div>

        <div class="pane-body">
            <div class="wave-stage">
                <canvas id="waveCanvas" width="960" height="260"></canvas>
            </div>
            <div class="sub-meta" id="micInfo" style="text-align: center; margin-bottom: 8px;"></div>
            <div class="bubbles-wrap" id="transcriptLog"></div>
        </div>
    </section>

</main>

<script>
    const TARGET_SAMPLE_RATE = 16000;
    const sessionId = "browser-" + Math.random().toString(36).slice(2, 10);

    const micBtn = document.getElementById("micBtn");
    const resetBtn = document.getElementById("resetBtn");
    const vadBadge = document.getElementById("vadBadge");
    const micInfo = document.getElementById("micInfo");
    const transcriptLog = document.getElementById("transcriptLog");
    const waveCanvas = document.getElementById("waveCanvas");
    const waveCtx = waveCanvas.getContext("2d");

    let recording = false;
    let isSpeechActive = false;
    let liveLevel = 0;
    let smoothedLevel = 0;
    let wavePhase = 0;

    let audioCtx = null;
    let mediaStream = null;
    let sourceNode = null;
    let processorNode = null;
    let sendQueue = Promise.resolve();

    function setVadBadge(state, label) {
        vadBadge.className = "status-pill " + (state || "");
        vadBadge.textContent = label;
    }

    function drawWave() {
        const w = waveCanvas.width;
        const h = waveCanvas.height;
        const midY = h / 2;

        waveCtx.clearRect(0, 0, w, h);

        const target = (recording && isSpeechActive) ? Math.max(0.18, liveLevel) : 0;
        smoothedLevel += (target - smoothedLevel) * 0.22;
        if (smoothedLevel < 0.005) smoothedLevel = 0;

        waveCtx.save();
        waveCtx.beginPath();
        waveCtx.lineWidth = 3.2;
        waveCtx.lineCap = "round";
        waveCtx.strokeStyle = "#111827";

        if (recording && isSpeechActive) {
            waveCtx.shadowColor = "rgba(34, 197, 94, 0.32)";
            waveCtx.shadowBlur = 14;
            wavePhase += 0.14;
        } else {
            waveCtx.shadowColor = "transparent";
            waveCtx.shadowBlur = 0;
        }

        const points = 90;
        for (let i = 0; i <= points; i++) {
            const x = (i / points) * w;
            const normX = (i / points) * 2 - 1;
            const envelope = Math.max(0, 1 - normX * normX);
            const amplitude = smoothedLevel * (h * 0.36) * envelope;
            const y = midY
                + Math.sin(i * 0.28 + wavePhase) * amplitude * 0.65
                + Math.sin(i * 0.62 - wavePhase * 1.3) * amplitude * 0.35;

            if (i === 0) {
                waveCtx.moveTo(x, y);
            } else {
                waveCtx.lineTo(x, y);
            }
        }

        waveCtx.stroke();
        waveCtx.restore();

        requestAnimationFrame(drawWave);
    }

    requestAnimationFrame(drawWave);

    function downsampleTo16kPcm16(float32Samples, inputSampleRate) {
        if (inputSampleRate === TARGET_SAMPLE_RATE) {
            return floatTo16BitPcm(float32Samples);
        }
        const ratio = inputSampleRate / TARGET_SAMPLE_RATE;
        const outLength = Math.floor(float32Samples.length / ratio);
        const downsampled = new Float32Array(outLength);
        for (let i = 0; i < outLength; i++) {
            const start = Math.floor(i * ratio);
            const end = Math.min(float32Samples.length, Math.floor((i + 1) * ratio));
            let sum = 0;
            for (let j = start; j < end; j++) {
                sum += float32Samples[j];
            }
            downsampled[i] = sum / Math.max(1, end - start);
        }
        return floatTo16BitPcm(downsampled);
    }

    function floatTo16BitPcm(samples) {
        const buffer = new ArrayBuffer(samples.length * 2);
        const view = new DataView(buffer);
        for (let i = 0; i < samples.length; i++) {
            const clamped = Math.max(-1, Math.min(1, samples[i]));
            const int16 = clamped < 0 ? clamped * 0x8000 : clamped * 0x7FFF;
            view.setInt16(i * 2, int16, true);
        }
        return new Uint8Array(buffer);
    }

    async function sendChunk(pcmBytes) {
        try {
            const resp = await fetch("/api/test/vad-chunk?sessionId=" + encodeURIComponent(sessionId), {
                method: "POST",
                headers: { "Content-Type": "application/octet-stream" },
                body: pcmBytes
            });
            if (!resp.ok) {
                micInfo.textContent = "Server error: HTTP " + resp.status;
                return;
            }
            const data = await resp.json();
            if (data.status === "listening") {
                isSpeechActive = false;
                setVadBadge("listening", "Listening");
            } else if (data.status === "speaking") {
                isSpeechActive = true;
                setVadBadge("speaking", "Speaking");
            } else if (data.status === "speech_ended") {
                isSpeechActive = false;
                setVadBadge("listening", "Listening");
                const text = data.transcript && data.transcript.trim() ? data.transcript.trim() : "";
                if (text) {
                    const bubble = document.createElement("div");
                    bubble.className = "bubble";
                    bubble.innerHTML = `<div class="bubble-text" dir="auto">${escapeHtml(text)}</div>
                        <div class="bubble-meta">VAD ${data.vadLatencyMs ?? 0}ms · STT ${data.sttLatencyMs ?? 0}ms</div>`;
                    transcriptLog.appendChild(bubble);
                    transcriptLog.scrollTop = transcriptLog.scrollHeight;
                }
            }
        } catch (err) {
            micInfo.textContent = "Network error: " + err.message;
        }
    }

    function escapeHtml(str) {
        return str.replace(/[&<>"']/g, c => ({
            "&": "&amp;", "<": "&lt;", ">": "&gt;", "\"": "&quot;", "'": "&#39;"
        }[c]));
    }

    micBtn.addEventListener("click", async () => {
        if (!recording) {
            try {
                mediaStream = await navigator.mediaDevices.getUserMedia({
                    audio: { channelCount: 1, echoCancellation: true, noiseSuppression: true }
                });
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                sourceNode = audioCtx.createMediaStreamSource(mediaStream);
                processorNode = audioCtx.createScriptProcessor(2048, 1, 1);

                processorNode.onaudioprocess = (event) => {
                    if (!recording) return;
                    const input = event.inputBuffer.getChannelData(0);

                    let sumSq = 0;
                    for (let i = 0; i < input.length; i++) {
                        sumSq += input[i] * input[i];
                    }
                    const rms = Math.sqrt(sumSq / Math.max(1, input.length));
                    liveLevel = Math.min(1, rms * 8);

                    const pcmBytes = downsampleTo16kPcm16(input, audioCtx.sampleRate);
                    sendQueue = sendQueue.then(() => sendChunk(pcmBytes));
                };

                sourceNode.connect(processorNode);
                processorNode.connect(audioCtx.destination);
                recording = true;
                isSpeechActive = false;
                micBtn.textContent = "Stop";
                micBtn.classList.add("recording");
                setVadBadge("listening", "Listening");
                micInfo.textContent = "";
            } catch (err) {
                micInfo.textContent = "Microphone unavailable: " + err.message;
            }
        } else {
            recording = false;
            isSpeechActive = false;
            liveLevel = 0;
            if (processorNode) processorNode.disconnect();
            if (sourceNode) sourceNode.disconnect();
            if (mediaStream) mediaStream.getTracks().forEach(t => t.stop());
            if (audioCtx) await audioCtx.close();
            micBtn.textContent = "Start";
            micBtn.classList.remove("recording");
            setVadBadge("", "Idle");
        }
    });

    resetBtn.addEventListener("click", async () => {
        isSpeechActive = false;
        liveLevel = 0;
        transcriptLog.innerHTML = "";
        await fetch("/api/test/vad-reset?sessionId=" + encodeURIComponent(sessionId), { method: "POST" });
        setVadBadge(recording ? "listening" : "", recording ? "Listening" : "Idle");
    });

    const ttsBtn = document.getElementById("ttsBtn");
    const ttsText = document.getElementById("ttsText");
    const ttsEmotion = document.getElementById("ttsEmotion");
    const ttsStatus = document.getElementById("ttsStatus");
    const ttsAudio = document.getElementById("ttsAudio");
    let currentAudioUrl = null;

    ttsBtn.addEventListener("click", async () => {
        const text = ttsText.value.trim();
        if (!text) return;
        ttsBtn.disabled = true;
        ttsStatus.textContent = "Generating...";
        const started = performance.now();

        try {
            const resp = await fetch("/api/test/tts", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ text, emotion: ttsEmotion.value })
            });
            if (!resp.ok) {
                ttsStatus.textContent = "Error: HTTP " + resp.status;
                return;
            }
            const blob = await resp.blob();
            if (currentAudioUrl) URL.revokeObjectURL(currentAudioUrl);
            currentAudioUrl = URL.createObjectURL(blob);
            ttsAudio.src = currentAudioUrl;
            ttsAudio.classList.add("visible");
            await ttsAudio.play().catch(() => {});
            const elapsed = Math.round(performance.now() - started);
            ttsStatus.textContent = `${elapsed}ms · ${(blob.size / 1024).toFixed(1)} KB`;
        } catch (err) {
            ttsStatus.textContent = "Error: " + err.message;
        } finally {
            ttsBtn.disabled = false;
        }
    });
</script>
</body>
</html>
