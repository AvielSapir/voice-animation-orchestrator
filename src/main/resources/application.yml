server:
  port: 8080

spring:
  application:
    name: voice-animation-orchestrator
  config:
    import: optional:file:.env[.properties]

orchestrator:
  websocket:
    endpoint: /ws/unity
    therapist-endpoint: /ws/therapist
    allowed-origins: "*"
    max-binary-message-size-bytes: 65536
    max-text-message-size-bytes: 16384
  audio:
    sample-rate-hz: 16000
    channels: 1
    bits-per-sample: 16
    chunk-duration-ms: 20
  vad:
    silence-threshold-ms: 1000
    energy-threshold: 0.02
    min-speech-duration-ms: 250
  ai:
    base-url: ${AI_ENGINE_BASE_URL:http://localhost:8081}
    turn-endpoint: /api/v1/turn
    timeout-ms: 5000
    internal-service-key: ${AI_INTERNAL_SERVICE_KEY:}
    llm-provider: ${LLM_PROVIDER:groq}
    llm-model: ${LLM_MODEL:qwen/qwen3.8-27b}
    available-llm-models:
      - qwen/qwen3.8-27b
      - openai/gpt-oss-120b
      - openai/gpt-oss-20b
  stt:
    provider: ${STT_PROVIDER:groq}
    model: ${STT_MODEL:whisper-large-v3-turbo}
    api-key: ${STT_API_KEY:${GROQ_API_KEY:}}
    language: he
    timeout-ms: 4000
  tts:
    provider: ${TTS_PROVIDER:cartesia}
    model: ${TTS_MODEL:sonic-3.6}
    api-key: ${TTS_API_KEY:${CARTESIA_API_KEY:}}
    voice-id: ${TTS_VOICE_ID:}
    language: he
    timeout-ms: 4000
  async:
    core-pool-size: 8
    max-pool-size: 32
    queue-capacity: 256
    thread-name-prefix: orch-
